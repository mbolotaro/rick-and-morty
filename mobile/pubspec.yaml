name: pickle_verso
description: "Aplicativo mobile do PickleVerso."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.0
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#071411"
  adaptive_icon_foreground: assets/icons/app_icon.png
  adaptive_icon_foreground_inset: 22
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#071411"
